          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target WaveletDenoise -j2
      - run:
          name: Denoise via wavelets
          command: LIONSS_LP=1 ./build/WaveletDenoise --in noisy.wav --levels 5

